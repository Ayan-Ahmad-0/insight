name: refresh-marts
on:
  workflow_dispatch:
    inputs:
      requested_by:
        description: "Organisation id that asked for the update"
        required: false
        type: string

# One build at a time. A newer request replaces an older one that is still waiting, and because it
# starts later it still includes everything the older request wanted.
concurrency:
  group: refresh-marts
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rebuild models and run tests
        run: python pipeline/run_dbt.py build