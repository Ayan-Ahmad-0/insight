name: daily-pipeline
on:
  schedule:
    - cron: "0 3 * * *"      # 03:00 UTC daily
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Ingest yesterday's events (stand-in for the client's product)
        run: python pipeline/generate_events.py
      - name: Source freshness
        run: python pipeline/run_dbt.py source freshness
      - name: Build models and run tests
        run: python pipeline/run_dbt.py build
      - name: ops check
        if: always()
        run: python scripts/ops_check.py