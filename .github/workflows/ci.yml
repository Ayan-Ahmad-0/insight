name: isolation-tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
      SEED_PASSWORD: ${{ secrets.SEED_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r api/requirements.txt
      - name: Check secrets and database connection
        run: |
          python - <<'EOF'
          import os, psycopg
          for k in ["DATABASE_URL", "SUPABASE_URL", "SUPABASE_ANON_KEY", "SEED_PASSWORD"]:
              print(k, "set" if os.environ.get(k) else "MISSING")
          u = os.environ.get("DATABASE_URL", "")
          print("db host:", u.split("@")[-1].split("/")[0])
          print(psycopg.connect(u, connect_timeout=10).execute("select 1").fetchone())
          EOF
      - run: pytest -q